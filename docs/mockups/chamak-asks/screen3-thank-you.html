<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>Screen 3: Thank-You Screen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #EFEAF2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #241027;
    padding: 20px 0;
  }
  .phone {
    width: 390px;
    height: 844px;
    background: #FAF7FB;
    border-radius: 44px;
    box-shadow: 0 25px 60px rgba(59, 9, 64, 0.18), 0 0 0 10px #2D2531;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  /* Status Bar */
  .status-bar {
    height: 48px;
    padding: 14px 28px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: #241027;
    z-index: 10;
  }
  .notch {
    width: 125px;
    height: 28px;
    background: #2D2531;
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    border-bottom-left-radius: 18px;
    border-bottom-right-radius: 18px;
  }

  /* Confetti Overlay */
  .confetti-canvas {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 5;
  }
  .confetti {
    position: absolute;
    width: 8px;
    height: 14px;
    border-radius: 3px;
    opacity: 0.85;
  }
  .c1 { top: 70px; left: 45px; background: #F5C842; transform: rotate(15deg); }
  .c2 { top: 90px; right: 50px; background: #85508a; transform: rotate(-25deg); }
  .c3 { top: 130px; left: 80px; background: #3E9B3A; transform: rotate(40deg); }
  .c4 { top: 160px; right: 70px; background: #E5533F; transform: rotate(-10deg); }
  .c5 { top: 120px; right: 120px; background: #3E73C8; transform: rotate(55deg); }
  .c6 { top: 220px; left: 40px; background: #F5C842; transform: rotate(-35deg); }
  .c7 { top: 250px; right: 40px; background: #C98ACF; transform: rotate(20deg); }
  .c8 { top: 190px; left: 130px; background: #F8A8B8; transform: rotate(-45deg); }

  /* Content */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 24px 100px;
    text-align: center;
    z-index: 10;
  }

  /* Dancing Chamku */
  .dancing-mascot-wrap {
    width: 140px;
    height: 140px;
    margin-bottom: 20px;
    position: relative;
  }
  .mascot-large {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 12px 20px rgba(245, 200, 66, 0.35));
    animation: cheer-bounce 1.5s ease-in-out infinite alternate;
  }
  .sparkle-badge {
    position: absolute;
    top: -5px;
    right: 0;
    background: #FFF4D6;
    border: 2px solid #F5C842;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.08);
  }

  .thank-you-title {
    font-size: 26px;
    font-weight: 900;
    color: #3b0940;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .thank-you-sub {
    font-size: 14.5px;
    color: #6B5A6E;
    line-height: 1.45;
    max-width: 280px;
    margin-bottom: 24px;
  }

  /* Reward Box */
  .reward-box {
    background: #FFFFFF;
    border: 2px solid #F5D67B;
    border-radius: 20px;
    padding: 16px 24px;
    width: 100%;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    box-shadow: 0 8px 18px rgba(184, 142, 28, 0.12);
    margin-bottom: 16px;
  }
  .reward-stars {
    font-size: 28px;
    font-weight: 900;
    color: #9A6B00;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .reward-desc {
    font-size: 12px;
    font-weight: 600;
    color: #7A5B00;
  }
  .total-stars-pill {
    background: #FAF7FB;
    border: 1px solid #E8DCE9;
    border-radius: 12px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 700;
    color: #3b0940;
    margin-top: 4px;
  }

  .friendly-note {
    font-size: 12px;
    color: #8C7853;
    background: #FFFDF0;
    border-radius: 10px;
    padding: 8px 12px;
    max-width: 300px;
    border: 1px dashed #EADB9E;
  }

  /* Bottom Button */
  .thumb-action-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #FFFFFF;
    border-top: 1px solid #E8DCE9;
    padding: 12px 18px 24px;
    box-shadow: 0 -4px 12px rgba(59, 9, 64, 0.05);
    z-index: 20;
  }
  .btn-home {
    width: 100%;
    height: 52px;
    background: #3b0940;
    color: #FFFFFF;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 0 #200424;
    cursor: pointer;
  }
  .home-bar {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 4px;
    background: #241027;
    border-radius: 2px;
    z-index: 30;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  
  <div class="status-bar">
    <span>9:41</span>
    <div style="display:flex;gap:6px;align-items:center;">
      <span>📶</span>
      <span>🔋</span>
    </div>
  </div>

  <!-- Confetti Elements -->
  <div class="confetti-canvas">
    <div class="confetti c1"></div>
    <div class="confetti c2"></div>
    <div class="confetti c3"></div>
    <div class="confetti c4"></div>
    <div class="confetti c5"></div>
    <div class="confetti c6"></div>
    <div class="confetti c7"></div>
    <div class="confetti c8"></div>
  </div>

  <div class="content">
    <!-- Dancing Mascot (Cheer pose with open smile and celebration arms) -->
    <div class="dancing-mascot-wrap">
      <svg class="mascot-large" viewBox="0 0 76 76">
        <!-- Body -->
        <path d="M38 4l9.5 19.3 21.3 3.1-15.4 15 3.6 21.2L38 52.6 19 62.6l3.6-21.2-15.4-15 21.3-3.1z" fill="#F5C842" stroke="#C99A12" stroke-width="2"/>
        <!-- Cheeks -->
        <ellipse cx="27" cy="42" rx="4.5" ry="3" fill="#F8A8B8"/>
        <ellipse cx="49" cy="42" rx="4.5" ry="3" fill="#F8A8B8"/>
        <!-- Cheer Arms (Raised in celebration) -->
        <path d="M8 30L1 20M68 30l7-10" stroke="#C99A12" stroke-width="3.4" stroke-linecap="round"/>
        <!-- Happy Eyes -->
        <path d="M27.5 34.5q3.5-4 7 0M41.5 34.5q3.5-4 7 0" stroke="#3b0940" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <!-- Open Laughing Mouth -->
        <path d="M30 40q8 9 16 0z" fill="#3b0940"/>
        <path d="M34 44q4 2.6 8 0" fill="#F27C9C"/>
      </svg>
      <div class="sparkle-badge">✨</div>
    </div>

    <h1 class="thank-you-title">You're Awesome! 🎉</h1>
    <p class="thank-you-sub">
      Chamku noted your vote! Your idea helps make learning fun for you and your friends.
    </p>

    <!-- Star Reward Card -->
    <div class="reward-box">
      <div class="reward-stars">
        <span>⭐</span>
        <span>+5 Stars</span>
      </div>
      <div class="reward-desc">Thank you for helping Chamku!</div>
      <div class="total-stars-pill">Total Stars: ⭐ 47</div>
    </div>

    <div class="friendly-note">
      💡 Chamku shares new quick questions every now and then. Come back tomorrow!
    </div>
  </div>

  <!-- Bottom Action Bar -->
  <div class="thumb-action-bar">
    <button class="btn-home">
      <span>Back to Home</span>
      <span>›</span>
    </button>
  </div>

  <div class="home-bar"></div>
</div>

</body>
</html>
